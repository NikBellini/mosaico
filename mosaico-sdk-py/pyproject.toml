[tool.poetry]
name = "mosaico-sdk-py"
version = "0.1.0"
description = "SDK for Mosaico Data-Platform"
authors = ["Mosaico Labs <info@mosaico.com>"]

packages = [{ include = "mosaicolabs", from = "src" }]

[tool.poetry.dependencies]
# Cambiato per includere la 3.12
python = ">=3.12,<4"
pyarrow = ">=17.0.0,<19.0.0"
numpy = ">=2.0.0,<2.3.0"
pandas = ">=2.2.2"
pillow = ">=10.0.0,<12.0.0"
pydantic = "^2.10.0"
rich = "^13.7.0"
rosbags = "^0.11.0"
av = "^12.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.3.0"
pre-commit = "^3.6.0"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["COM812", "E501"]

[tool.ruff.format]
skip-magic-trailing-comma = false
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
combine-as-imports = true

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
"mosaico.ros_injector" = "mosaicolabs.ros_bridge.injector:ros_injector"
"mosaico.testing" = "testing.testing:mosaico_testing"
